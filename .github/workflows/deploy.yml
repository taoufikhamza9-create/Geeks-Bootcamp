# déploie le site sur GitHub Pages à chaque push sur main
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:   # permet aussi de le lancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'Week 3/Day 3/ExerciseXP/pro'   # le dossier de mon site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
